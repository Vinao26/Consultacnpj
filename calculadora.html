<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Central de Calculadoras Financeiras</title>
  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --success-color: #25D366;
      --success-hover: #1da851;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    /* System Design para Abas Nav */
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: #eef2f5;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: #666;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* Form & Inputs */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #fafafa;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #fff;
    }

    /* Actions Buttons */
    .btn-calc {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-calc:hover {
      background-color: var(--primary-hover);
    }

    /* Estilo dos Resultados */
    .result-box {
      margin-top: 20px;
      display: none;
    }

    .result-card {
      background: #f0f7ff;
      border: 1px solid #cce3ff;
      border-radius: 10px;
      padding: 15px;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .result-card h3 {
      color: var(--primary-color);
      font-size: 1.05rem;
      margin-bottom: 10px;
      border-bottom: 1px dashed #cce3ff;
      padding-bottom: 5px;
    }

    .highlight {
      font-weight: bold;
      color: #0056b3;
    }

    /* Botões de Compartilhamento */
    .share-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .share-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn-copy { background-color: #e2e8f0; color: #333; }
    .btn-wsp { background-color: var(--success-color); color: white; }
    .btn-pdf { background-color: #6c757d; color: white; }

    .share-btn:hover { opacity: 0.9; }

    /* Ajustes para Impressão / PDF */
    @media print {
      body { background: white; padding: 0; }
      .app-container { box-shadow: none; max-width: 100%; }
      .nav-tabs, .btn-calc, .share-actions, form { display: none !important; }
      .tab-content { display: block !important; }
      .result-box { display: block !important; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>Central de Calculadoras</h1>

    <!-- Abas de Navegação -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('markup')">Markup</button>
      <button class="tab-btn" onclick="switchTab('calculo-aderido')">Cálculo do Aderido</button>
      <button class="tab-btn" onclick="switchTab('margem')">Margem</button>
    </div>

    <!-- ABA 1: MARKUP -->
    <div id="markup" class="tab-content active">
      <form id="formMarkup">
        <div class="form-group">
          <label for="custoM">Custo (R$):</label>
          <input type="number" id="custoM" placeholder="Ex: 50.00" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="markupPercentual">Markup (%) (Opcional):</label>
          <input type="number" id="markupPercentual" placeholder="Ex: 50" step="0.01">
        </div>
        <div class="form-group">
          <label for="precoVendaDesejado">Preço Desejado (R$) (Opcional):</label>
          <input type="number" id="precoVendaDesejado" placeholder="Ex: 75.00" step="0.01">
        </div>
        <button type="button" class="btn-calc" onclick="calcularMarkup()">Calcular Markup</button>
      </form>

      <div class="result-box" id="resMarkup">
        <div class="result-card" id="cardMarkup"></div>
        <div class="share-actions">
          <button class="share-btn btn-copy" onclick="copiarTexto('txtMarkup')">Copiar</button>
          <button class="share-btn btn-wsp" onclick="compartilharWhatsApp('txtMarkup')">WhatsApp</button>
          <button class="share-btn btn-pdf" onclick="gerarPDF()">PDF</button>
        </div>
      </div>
    </div>

    <!-- ABA 2: CÁLCULO DO ADERIDO (NAD x AD) -->
    <div id="calculo-aderido" class="tab-content">
      <form id="formCalculoAderido">
        <div class="form-group">
          <label for="custoCaixaNAD">Custo Caixa (NAD) - R$:</label>
          <input type="number" id="custoCaixaNAD" placeholder="Ex: 84.90" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="custoCaixaAD">Custo Caixa (AD) - R$:</label>
          <input type="number" id="custoCaixaAD" placeholder="Ex: 80.00" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="precoVendaUnidadeNAD">Preço Unidade (NAD) - R$:</label>
          <input type="number" id="precoVendaUnidadeNAD" placeholder="Ex: 12.00" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="precoVendaUnidadeAD">Preço Unidade (AD) - R$:</label>
          <input type="number" id="precoVendaUnidadeAD" placeholder="Ex: 10.50" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="unidadesPorCaixa">Unidades por Caixa:</label>
          <input type="number" id="unidadesPorCaixa" placeholder="Ex: 12" required>
        </div>
        <div class="form-group">
          <label for="qtdVendida">Qtd. Vendida (Caixas):</label>
          <input type="number" id="qtdVendida" placeholder="Ex: 15" required>
        </div>
        <button type="button" class="btn-calc" onclick="calcularAderido()">Calcular Aderido</button>
      </form>

      <div class="result-box" id="resCalculoAderido">
        <div class="result-card" id="cardCalculoAderido"></div>
        <div class="share-actions">
          <button class="share-btn btn-copy" onclick="copiarTexto('txtCalculoAderido')">Copiar</button>
          <button class="share-btn btn-wsp" onclick="compartilharWhatsApp('txtCalculoAderido')">WhatsApp</button>
          <button class="share-btn btn-pdf" onclick="gerarPDF()">PDF</button>
        </div>
      </div>
    </div>

    <!-- ABA 3: MARGEM DE LUCRO -->
    <div id="margem" class="tab-content">
      <form id="formMargem">
        <div class="form-group">
          <label for="custoMargem">Custo (R$):</label>
          <input type="number" id="custoMargem" placeholder="Ex: 40.00" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="precoVendaMargem">Preço de Venda (R$) (Opcional):</label>
          <input type="number" id="precoVendaMargem" placeholder="Para descobrir a margem" step="0.01">
        </div>
        <div class="form-group">
          <label for="margemDesejada">OU Margem Desejada (%) (Opcional):</label>
          <input type="number" id="margemDesejada" placeholder="Para descobrir o preço" step="0.01">
        </div>
        <button type="button" class="btn-calc" onclick="calcularMargemLucro()">Calcular Margem/Preço</button>
      </form>

      <div class="result-box" id="resMargem">
        <div class="result-card" id="cardMargem"></div>
        <div class="share-actions">
          <button class="share-btn btn-copy" onclick="copiarTexto('txtMargem')">Copiar</button>
          <button class="share-btn btn-wsp" onclick="compartilharWhatsApp('txtMargem')">WhatsApp</button>
          <button class="share-btn btn-pdf" onclick="gerarPDF()">PDF</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let textosResumo = {
      txtMarkup: '',
      txtCalculoAderido: '',
      txtMargem: ''
    };

    // Alternar entre as Abas
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // 1. Cálculo de Markup
    function calcularMarkup() {
      const custo = parseFloat(document.getElementById('custoM').value);
      const markup = parseFloat(document.getElementById('markupPercentual').value);
      const precoVendaDesejado = parseFloat(document.getElementById('precoVendaDesejado').value);
      const container = document.getElementById('resMarkup');
      const card = document.getElementById('cardMarkup');

      if (isNaN(custo) || custo <= 0) {
        alert('Por favor, informe um custo válido!');
        return;
      }

      let pVenda = 0, mkp = 0, lucro = 0;

      if (!isNaN(precoVendaDesejado) && precoVendaDesejado > 0) {
        mkp = ((precoVendaDesejado - custo) / custo) * 100;
        pVenda = precoVendaDesejado;
        lucro = pVenda - custo;
      } else if (!isNaN(markup) && markup >= 0) {
        pVenda = custo * (1 + markup / 100);
        mkp = markup;
        lucro = pVenda - custo;
      } else {
        alert('Preencha o Markup (%) ou o Preço Desejado.');
        return;
      }

      card.innerHTML = `
        <h3>Resumo: Cálculo de Markup</h3>
        Custo: <strong>R$ ${custo.toFixed(2)}</strong><br>
        Preço de Venda: <span class="highlight">R$ ${pVenda.toFixed(2)}</span><br>
        Markup Aplicado: <span class="highlight">${mkp.toFixed(2)}%</span><br>
        Lucro Obtido: <span class="highlight">R$ ${lucro.toFixed(2)}</span>
      `;

      textosResumo.txtMarkup = `*Resumo - Cálculo de Markup*\nCusto: R$ ${custo.toFixed(2)}\nPreço Venda: R$ ${pVenda.toFixed(2)}\nMarkup: ${mkp.toFixed(2)}%\nLucro: R$ ${lucro.toFixed(2)}`;
      container.style.display = 'block';
    }

    // 2. Cálculo do Aderido (NAD x AD)
    function calcularAderido() {
      const cNAD = parseFloat(document.getElementById('custoCaixaNAD').value);
      const cAD = parseFloat(document.getElementById('custoCaixaAD').value);
      const pUnNAD = parseFloat(document.getElementById('precoVendaUnidadeNAD').value);
      const pUnAD = parseFloat(document.getElementById('precoVendaUnidadeAD').value);
      const unCaixa = parseInt(document.getElementById('unidadesPorCaixa').value);
      const qtdVend = parseInt(document.getElementById('qtdVendida').value);
      
      const container = document.getElementById('resCalculoAderido');
      const card = document.getElementById('cardCalculoAderido');

      if ([cNAD, cAD, pUnNAD, pUnAD, unCaixa, qtdVend].some(v => isNaN(v) || v <= 0)) {
        alert('Por favor, preencha todos os campos com valores válidos!');
        return;
      }

      // Custos por unidade
      const cUnNAD = cNAD / unCaixa;
      const cUnAD = cAD / unCaixa;

      // Lucros por unidade
      const lUnNAD = pUnNAD - cUnNAD;
      const lUnAD = pUnAD - cUnAD;
      const mUnNAD = (lUnNAD / pUnNAD) * 100;
      const mUnAD = (lUnAD / pUnAD) * 100;

      // Receitas e Lucros por caixa
      const recCaixaNAD = pUnNAD * unCaixa;
      const recCaixaAD = pUnAD * unCaixa;
      const lCxNAD = recCaixaNAD - cNAD;
      const lCxAD = recCaixaAD - cAD;

      // Lucros totais
      const lTotNAD = lUnNAD * unCaixa * qtdVend;
      const lTotAD = lUnAD * unCaixa * qtdVend;

      // Comparativos
      const difLucro = lTotNAD - lTotAD;
      const caixasExtra = lCxAD > 0 ? (difLucro / lCxAD) : 0;

      card.innerHTML = `
        <h3>Resumo: Cálculo do Aderido</h3>
        <strong>CENÁRIO NAD:</strong><br>
        • Custo/Caixa: R$ ${cNAD.toFixed(2)} (R$ ${cUnNAD.toFixed(2)}/un)<br>
        • Preço Venda/Un: R$ ${pUnNAD.toFixed(2)}<br>
        • Lucro/Unidade: R$ ${lUnNAD.toFixed(2)} (${mUnNAD.toFixed(2)}%)<br>
        • Lucro Total: <span class="highlight">R$ ${lTotNAD.toFixed(2)}</span><br><br>

        <strong>CENÁRIO AD (ADERIDO):</strong><br>
        • Custo/Caixa: R$ ${cAD.toFixed(2)} (R$ ${cUnAD.toFixed(2)}/un)<br>
        • Preço Venda/Un: R$ ${pUnAD.toFixed(2)}<br>
        • Lucro/Unidade: R$ ${lUnAD.toFixed(2)} (${mUnAD.toFixed(2)}%)<br>
        • Lucro Total: <span class="highlight">R$ ${lTotAD.toFixed(2)}</span><br><br>

        <strong>ANÁLISE COMPARATIVA:</strong><br>
        • Diferença de Lucro Total: R$ ${difLucro.toFixed(2)}<br>
        • Caixas AD necessárias p/ igualar NAD: <span class="highlight">${caixasExtra.toFixed(2)} cx</span>
      `;

      textosResumo.txtCalculoAderido = `*Resumo - Cálculo do Aderido*\n\n*NAD:*\n- Custo Cx: R$ ${cNAD.toFixed(2)} (R$ ${cUnNAD.toFixed(2)}/un)\n- Preço Venda/Un: R$ ${pUnNAD.toFixed(2)}\n- Lucro/Un: R$ ${lUnNAD.toFixed(2)} (${mUnNAD.toFixed(2)}%)\n- Lucro Total: R$ ${lTotNAD.toFixed(2)}\n\n*AD (Aderido):*\n- Custo Cx: R$ ${cAD.toFixed(2)} (R$ ${cUnAD.toFixed(2)}/un)\n- Preço Venda/Un: R$ ${pUnAD.toFixed(2)}\n- Lucro/Un: R$ ${lUnAD.toFixed(2)} (${mUnAD.toFixed(2)}%)\n- Lucro Total: R$ ${lTotAD.toFixed(2)}\n\n*Comparativo:*\n- Dif. de Lucro: R$ ${difLucro.toFixed(2)}\n- Cx AD extra necessárias: ${caixasExtra.toFixed(2)}`;
      container.style.display = 'block';
    }

    // 3. Cálculo de Margem
    function calcularMargemLucro() {
      const custo = parseFloat(document.getElementById('custoMargem').value);
      const pVenda = parseFloat(document.getElementById('precoVendaMargem').value);
      const margemDesejada = parseFloat(document.getElementById('margemDesejada').value);
      
      const container = document.getElementById('resMargem');
      const card = document.getElementById('cardMargem');

      if (isNaN(custo) || custo <= 0) {
        alert('Por favor, informe um custo válido!');
        return;
      }

      let resPVenda = 0, resMargem = 0, resLucro = 0;

      if (!isNaN(pVenda) && pVenda > 0) {
        resLucro = pVenda - custo;
        resMargem = (resLucro / pVenda) * 100;
        resPVenda = pVenda;
      } else if (!isNaN(margemDesejada) && margemDesejada > 0 && margemDesejada < 100) {
        resPVenda = custo / (1 - (margemDesejada / 100));
        resMargem = margemDesejada;
        resLucro = resPVenda - custo;
      } else {
        alert('Informe o Preço de Venda OU a Margem Desejada (< 100%).');
        return;
      }

      card.innerHTML = `
        <h3>Resumo: Margem de Lucro</h3>
        Custo: <strong>R$ ${custo.toFixed(2)}</strong><br>
        Preço de Venda: <span class="highlight">R$ ${resPVenda.toFixed(2)}</span><br>
        Margem de Lucro: <span class="highlight">${resMargem.toFixed(2)}%</span><br>
        Lucro Valor: <span class="highlight">R$ ${resLucro.toFixed(2)}</span>
      `;

      textosResumo.txtMargem = `*Resumo - Margem de Lucro*\nCusto: R$ ${custo.toFixed(2)}\nPreço Venda Sugerido: R$ ${resPVenda.toFixed(2)}\nMargem: ${resMargem.toFixed(2)}%\nLucro: R$ ${resLucro.toFixed(2)}`;
      container.style.display = 'block';
    }

    // Funções de Compartilhamento e PDF
    function copiarTexto(chave) {
      const texto = textosResumo[chave];
      navigator.clipboard.writeText(texto).then(() => {
        alert('Resumo copiado com sucesso!');
      });
    }

    function compartilharWhatsApp(chave) {
      const texto = textosResumo[chave];
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    function gerarPDF() {
      window.print();
    }
  </script>
</body>
</html>
