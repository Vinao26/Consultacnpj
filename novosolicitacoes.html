<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planejador & Central de Positivação BI</title>
  
  <!-- Fontes & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leitor de Excel XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0891b2;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      max-width: 1280px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Upload Card */
    .db-card {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .db-info { display: flex; align-items: center; gap: 12px; }
    .db-info i { font-size: 24px; color: var(--primary); }
    .db-status { font-size: 13px; font-weight: 500; }

    .db-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: #e2e8f0;
      color: #475569;
    }

    .db-badge.active { background: #dcfce7; color: #15803d; }

    .upload-btn {
      background: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .upload-btn:hover { background: var(--primary-hover); }
    .upload-btn input[type="file"] { display: none; }

    .btn-clear-db {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-clear-db:hover { background: #fecaca; }

    /* Tabs Nav */
    .tabs-nav {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
      border-radius: 8px 8px 0 0;
    }

    .tab-btn:hover { color: var(--primary); background: #f8fafc; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #eff6ff; }

    .tab-title-input {
      border: none;
      background: transparent;
      font-weight: 600;
      font-size: 13px;
      color: inherit;
      width: 75px;
      border-bottom: 1px dashed var(--text-muted);
      outline: none;
    }

    /* Form Area */
    #formulario {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .check-group {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .check-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .check-group label {
      font-weight: 600;
      font-size: 12px;
      color: #374151;
      text-transform: uppercase;
    }

    .check-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .check-group input[type="text"],
    .check-group input[type="number"],
    .check-group input[type="date"],
    .check-group input[type="file"],
    .check-group select,
    .check-group textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13.5px;
      background: #fff;
    }

    .check-group input:focus, .check-group select:focus, .check-group textarea:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Autocomplete */
    .autocomplete-items {
      position: absolute;
      border: 1px solid var(--border-color);
      border-top: none;
      z-index: 99;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background-color: #fff;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .autocomplete-items div {
      padding: 9px 12px;
      cursor: pointer;
      font-size: 12.5px;
      border-bottom: 1px solid #f1f5f9;
    }

    .autocomplete-items div:hover { background-color: #eff6ff; color: var(--primary); }

    /* Layout Vertical de Produtos na Bonificação */
    .produto-vertical-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .produto-card-vertical {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .produto-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--primary);
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 8px;
    }

    .produto-fields-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 640px) {
      .produto-fields-grid { grid-template-columns: 2fr 1fr 1fr; }
    }

    /* --- ESTILOS DA ABA POSITIVAÇÃO --- */
    .positivacao-panel { display: flex; flex-direction: column; gap: 20px; }

    .exec-summary-box {
      background: #1e293b;
      color: #ffffff;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .exec-summary-box .title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
    }

    .exec-summary-box .value-main {
      font-size: 1.8rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .kpi-grid-exec {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .kpi-card-exec {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 15px;
      position: relative;
    }

    .kpi-card-exec .lbl {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .kpi-card-exec .val-percent {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 2px 0;
    }

    .kpi-card-exec .sub-details {
      font-size: 11px;
      color: #475569;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 8px;
      height: 6px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      background: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Estilo de Filtragem por Colunas tipo Excel */
    .excel-table-container {
      max-height: 520px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #fff;
    }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      white-space: nowrap;
    }

    .excel-table th, .excel-table td {
      padding: 9px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid #f1f5f9;
    }

    .excel-table th {
      background: #f8fafc;
      font-weight: 700;
      color: #334155;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .th-filter-select {
      margin-top: 5px;
      display: block;
      width: 100%;
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-weight: normal;
    }

    .tag-status {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .tag-status.ok { background: #dcfce7; color: #166534; }
    .tag-status.nok { background: #fee2e2; color: #991b1b; }

    /* Modais Gerais */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: #ffffff;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    /* Loading Overlay */
    #loading-overlay {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(255,255,255,0.88);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--primary);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.9s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    button.btn-action {
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-wa-direct { background: #25D366; color: white; }
    .btn-wa-direct:hover { background: #1ebc57; }
    .btn-add { background: var(--primary); color: white; }
    .btn-add:hover { background: var(--primary-hover); }
    .btn-share { background: var(--secondary); color: white; }
    .btn-pdf { background: #dc2626; color: white; }
    .btn-pdf:hover { background: #b91c1c; }

    /* Output Section */
    .output-section { margin-top: 20px; }
    .output-header { font-weight: 600; font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
    .output {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
      max-height: 280px;
      overflow-y: auto;
    }

    .item-container {
      background: #ffffff;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 12px 16px;
      position: relative;
      white-space: pre-line;
      font-family: monospace;
      font-size: 12.5px;
    }

    .item-container .btn-del {
      position: absolute;
      top: 10px;
      right: 12px;
      background: #fee2e2;
      color: var(--danger);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Overlay de Carregamento -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Processando dados otimizados...</div>
  </div>

  <div class="container" id="app-container">
    <div class="header">
      <h2><i class="fa-solid fa-chart-line"></i> Planejador & Gestão de Positivação</h2>
    </div>

    <!-- Upload Banco de Dados (Planilha) -->
    <div class="db-card">
      <div class="db-info">
        <i class="fa-solid fa-file-excel"></i>
        <div>
          <div style="font-weight: 600; font-size: 14.5px;">Banco de Dados da Planilha</div>
          <div class="db-status">
            PDVs/Setores: <span id="count-pdv" class="db-badge">0 reg</span> | 
            Produtos: <span id="count-prod" class="db-badge">0 reg</span>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <label class="upload-btn">
          <i class="fa-solid fa-cloud-arrow-up"></i> Upload Planilha Excel
          <input type="file" id="excel-file-input" accept=".xlsx, .xls" onchange="iniciarProcessamentoPlanilha(event)">
        </label>
        <button class="btn-clear-db" onclick="limparBancoDeDados()" title="Limpar dados salvos no navegador">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </div>

    <!-- Navegação por Abas (Tabs) -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('janela', this)">
        <i class="fa-regular fa-calendar-check"></i> Janela de Entrega
      </button>
      <button class="tab-btn" onclick="switchTab('bonificacao', this)">
        <i class="fa-solid fa-gift"></i> Bonificação
      </button>
      <button class="tab-btn" onclick="switchTab('desconto', this)">
        <i class="fa-solid fa-percent"></i> Desconto
      </button>
      <button class="tab-btn" onclick="switchTab('limite', this)">
        <i class="fa-solid fa-wallet"></i> Limite
      </button>
      <button class="tab-btn" onclick="switchTab('ativacao', this)">
        <i class="fa-solid fa-bolt"></i> 
        <input type="text" id="nome-aba-ativacao" class="tab-title-input" value="Ativação" onclick="event.stopPropagation()" onchange="salvarNomesAbas()">
      </button>
      <button class="tab-btn" onclick="switchTab('custom', this)">
        <i class="fa-solid fa-sliders"></i> 
        <input type="text" id="nome-aba-custom" class="tab-title-input" value="Custom" onclick="event.stopPropagation()" onchange="salvarNomesAbas()">
      </button>
      <button class="tab-btn" onclick="switchTab('positivacao', this)">
        <i class="fa-solid fa-chart-pie"></i> Positivação (Setor)
      </button>
    </div>

    <!-- Formulário / Conteúdo Dinâmico -->
    <div id="formulario"></div>

    <!-- Botões de Ação Principais -->
    <div class="buttons" id="main-buttons">
      <button class="btn-action btn-wa-direct" onclick="enviarDiretoWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> Enviar este para WhatsApp
      </button>
      <button class="btn-action btn-add" onclick="adicionarItem()">
        <i class="fa-solid fa-plus"></i> Adicionar ao Lote
      </button>
      <button class="btn-action btn-share" onclick="gerarWhatsapp()">
        <i class="fa-solid fa-share-nodes"></i> Compartilhar Lote no WhatsApp
      </button>
    </div>

    <!-- Saída do Lote -->
    <div class="output-section" id="output-section">
      <div class="output-header"><i class="fa-solid fa-layer-group"></i> Itens no Lote:</div>
      <div class="output" id="saida"></div>
    </div>
  </div>

  <!-- MODAL DE PRÉ-FILTRO DE IMPORTAÇÃO -->
  <div class="modal-overlay" id="modal-pre-filtro">
    <div class="modal-container">
      <div class="modal-header">
        <h3><i class="fa-solid fa-filter"></i> Pré-Filtro de Importação</h3>
        <button class="modal-close" onclick="fecharModalPreFiltro()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:15px;">
          Foram varridas <strong>todas as abas da planilha</strong>. Selecione o setor para filtrar ou importe todos.
        </p>
        <div class="check-group">
          <label>Filtrar Setor na Importação:</label>
          <select id="select-setor-importacao">
            <option value="TODOS">Carregar Todos os Setores</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-add" style="width:100%; justify-content:center;" onclick="confirmarImportacaoComFiltro()">
          <i class="fa-solid fa-check"></i> Importar Dados das Abas
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- PERSISTÊNCIA LOCAL (IndexedDB para Planilhas Grandes) ---
    const DB_NAME = 'BI_Planner_DB';
    const DB_VERSION = 1;
    let dbInstance = null;

    function abrirDB() {
      return new Promise((resolve, reject) => {
        if (dbInstance) return resolve(dbInstance);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('app_state')) {
            db.createObjectStore('app_state');
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = (e) => reject(e);
      });
    }

    async function salvarPlanilhaNoDB(dbPDVs, dbProdutos, setoresDisponiveis) {
      try {
        const db = await abrirDB();
        const tx = db.transaction('app_state', 'readwrite');
        const store = tx.objectStore('app_state');
        store.put(dbPDVs, 'dbPDVs');
        store.put(dbProdutos, 'dbProdutos');
        store.put(setoresDisponiveis, 'setoresDisponiveis');
      } catch (err) {
        console.error('Erro ao salvar no IndexedDB:', err);
      }
    }

    async function carregarPlanilhaDoDB() {
      try {
        const db = await abrirDB();
        const tx = db.transaction('app_state', 'readonly');
        const store = tx.objectStore('app_state');

        const getReq = (key) => new Promise((res) => {
          const r = store.get(key);
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        });

        const pdvs = await getReq('dbPDVs');
        const prods = await getReq('dbProdutos');
        const setores = await getReq('setoresDisponiveis');

        if (pdvs && Array.isArray(pdvs)) state.dbPDVs = pdvs;
        if (prods && Array.isArray(prods)) state.dbProdutos = prods;
        if (setores && Array.isArray(setores)) state.setoresDisponiveis = setores;

        atualizarBadgesUpload();
      } catch (err) {
        console.error('Erro ao carregar do IndexedDB:', err);
      }
    }

    async function limparBancoDeDados() {
      if (confirm("Deseja apagar o banco de dados da planilha salvo no navegador?")) {
        try {
          const db = await abrirDB();
          const tx = db.transaction('app_state', 'readwrite');
          tx.objectStore('app_state').clear();
          state.dbPDVs = [];
          state.dbProdutos = [];
          state.setoresDisponiveis = [];
          atualizarBadgesUpload();
          if (state.currentTab === 'positivacao') renderForm();
          alert("Dados da planilha limpos com sucesso!");
        } catch (err) {
          alert("Erro ao limpar o banco de dados.");
        }
      }
    }

    // --- Estado Global da Aplicação ---
    const state = {
      currentTab: 'janela',
      itens: [],
      dbPDVs: [],
      dbProdutos: [],

    // --- CARREGAMENTO E VARREDURA DE TODAS AS ABAS DA PLANILHA ---
    function iniciarProcessamentoPlanilha(event) {
      const file = event.target.files[0];
      if (!file) return;

      mostrarSpinner("Varrendo todas as abas da planilha...");

      setTimeout(() => {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: false, cellStyles: false });
            state.tempWorkbookRaw = workbook;

            const setoresSet = new Set();

            workbook.SheetNames.forEach(sheetName => {
              const sheet = workbook.Sheets[sheetName];
              const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
              
              json.forEach((row) => {
                if (row && row.length > 0) {
                  row.forEach(cell => {
                    if (cell !== undefined && cell !== null) {
                      const strVal = String(cell).trim();
                      if (/^\d{3,4}$/.test(strVal) && (strVal.startsWith('4') || strVal.startsWith('1'))) {
                        setoresSet.add(strVal);
                      }
                    }
                  });
                }
              });
            });

            const selectImport = document.getElementById('select-setor-importacao');
            selectImport.innerHTML = '<option value="TODOS">Carregar Todos os Setores</option>';
            [...setoresSet].sort().forEach(s => {
              selectImport.innerHTML += `<option value="${s}">Setor ${s}</option>`;
            });

            ocultarSpinner();
            document.getElementById('modal-pre-filtro').classList.add('active');
          } catch (err) {
            ocultarSpinner();
            alert('Erro ao ler arquivo Excel: ' + err.message);
          }
        };
        reader.onerror = () => {
          ocultarSpinner();
          alert('Erro na leitura do arquivo.');
        };
        reader.readAsArrayBuffer(file);
      }, 50);
    }

    function fecharModalPreFiltro() {
      document.getElementById('modal-pre-filtro').classList.remove('active');
      state.tempWorkbookRaw = null;
      document.getElementById('excel-file-input').value = '';
    }

    function confirmarImportacaoComFiltro() {
      const setorFiltro = document.getElementById('select-setor-importacao').value;
      const workbook = state.tempWorkbookRaw;
      fecharModalPreFiltro();

      if (!workbook) return;

      mostrarSpinner("Processando dados de todas as abas...");

      setTimeout(() => {
        try {
          state.dbPDVs = [];
          
          workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            const jsonPainel = XLSX.utils.sheet_to_json(sheet, { header: 1 });

            jsonPainel.forEach((row, idx) => {
              if (idx >= 1 && row && row.length >= 6) {
                const codCandidate = row[4] || row[0];
                const nomeCandidate = row[5] || row[1];
                const setorCandidate = String(row[3] || row[2] || '').trim();

                if (codCandidate && nomeCandidate && !isNaN(codCandidate)) {
                  if (setorFiltro === 'TODOS' || setorCandidate === setorFiltro) {
                    state.dbPDVs.push({
                      frequencia: String(row[1] || 'SEG/SAB'),
                      gv: String(row[2] || ''),
                      setor: setorCandidate || '414',
                      codigo: String(codCandidate).trim(),
                      nome: String(nomeCandidate).trim(),
                      produtos_tt: String(row[6] || '').toUpperCase().trim() === 'OK' ? 'OK' : 'NOK',
                      nab: String(row[7] || '').toUpperCase().trim() === 'OK' ? 'OK' : 'NOK',
                      cerveja: String(row[8] || '').toUpperCase().trim() === 'OK' ? 'OK' : 'NOK',
                      mkt: String(row[9] || '').toUpperCase().trim() === 'OK' ? 'OK' : 'NOK',
                      stela_pg: String(row[10] || '').toUpperCase().trim() === 'OK' ? 'OK' : 'NOK',
                      florestal: String(row[11] || '').toUpperCase().trim() === 'OK' ? 'OK' : 'NOK'
                    });
                  }
                }
              }
            });
          });

          const pdvMap = new Map();
          state.dbPDVs.forEach(item => {
            if (!pdvMap.has(item.codigo)) {
              pdvMap.set(item.codigo, item);
            }
          });
          state.dbPDVs = Array.from(pdvMap.values());

          state.setoresDisponiveis = [...new Set(state.dbPDVs.map(p => p.setor).filter(Boolean))].sort();

          state.dbProdutos = [];
          const produtosUnicosMap = new Map();

          workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            const jsonProd = XLSX.utils.sheet_to_json(sheet);

            jsonProd.forEach(row => {
              const cod = row['Cod.Produto'] || row['Codigo'] || row['PRODUTO TOTAL'] || row['CODIGO'];
              const desc = row['Desc.Produto'] || row['Descrição'] || row['Descricao'] || row['PRODUTO'];
              
              if (cod && desc) {
                const codigoLimpo = String(cod).trim();
                const nomeLimpo = String(desc).trim();

                if (!produtosUnicosMap.has(codigoLimpo)) {
                  produtosUnicosMap.set(codigoLimpo, {
                    codigo: codigoLimpo,
                    nome: nomeLimpo
                  });
                }
              }
            });
          });

          state.dbProdutos = Array.from(produtosUnicosMap.values());

          atualizarBadgesUpload();
          salvarPlanilhaNoDB(state.dbPDVs, state.dbProdutos, state.setoresDisponiveis);

          ocultarSpinner();
          alert(`Importação Concluída!\n${state.dbPDVs.length} PDVs e ${state.dbProdutos.length} Produtos unificados de todas as abas.`);
          
          if (state.currentTab === 'positivacao') renderForm();
        } catch (err) {
          ocultarSpinner();
          alert("Ocorreu um erro ao processar os dados: " + err.message);
        }
      }, 50);
    }

    // --- Autocomplete ---
    function setupAutocomplete(inputEl, targetInputEl, type) {
      if (!inputEl) return;
      inputEl.addEventListener("input", function() {
        const val = this.value;
        closeAllLists();
        if (!val) return false;

        const listDiv = document.createElement("DIV");
        listDiv.setAttribute("class", "autocomplete-items");
        this.parentNode.appendChild(listDiv);

        const dataset = type === 'pdv' ? state.dbPDVs : state.dbProdutos;
        const searchVal = val.toUpperCase();
        
        let matches = dataset.filter(item => 
          (item.codigo && item.codigo.toUpperCase().includes(searchVal)) || 
          (item.nome && item.nome.toUpperCase().includes(searchVal))
        ).slice(0, 15);

        matches.forEach(item => {
          const b = document.createElement("DIV");
          b.innerHTML = `[${item.codigo}] ${item.nome}`.replace(new RegExp(val, "gi"), (match) => `<strong>${match}</strong>`);
          
          b.addEventListener("click", function() {
            if (inputEl.id.includes('cod') || inputEl.id.includes('codigo')) {
              inputEl.value = item.codigo;
              if (targetInputEl) targetInputEl.value = item.nome;
            } else {
              inputEl.value = item.nome;
              if (targetInputEl) targetInputEl.value = item.codigo;
            }
            closeAllLists();
          });
          listDiv.appendChild(b);
        });
      });

      function closeAllLists(elmnt) {
        const x = document.getElementsByClassName("autocomplete-items");
        for (let i = 0; i < x.length; i++) {
          if (elmnt != x[i] && elmnt != inputEl) x[i].parentNode.removeChild(x[i]);
        }
      }

      document.addEventListener("click", (e) => closeAllLists(e.target));
    }

    function atualizarFiltrosPositivacao() {
      const getVal = (id) => document.getElementById(id) ? document.getElementById(id).value : 'TODOS';
      
      state.posFilters = {
        codigo: (document.getElementById('pos-filter-cod')?.value || '').toLowerCase().trim(),
        nome: (document.getElementById('pos-filter-nome')?.value || '').toLowerCase().trim(),
        freq: getVal('pos-filter-freq'),
        setor: getVal('pos-filter-setor'),
        produtos_tt: getVal('pos-filter-tt'),
        cerveja: getVal('pos-filter-cerveja'),
        nab: getVal('pos-filter-nab'),
        mkt: getVal('pos-filter-mkt'),
        stela_pg: getVal('pos-filter-stela'),
        florestal: getVal('pos-filter-florestal')
      };

      renderPositivacaoData();
    }

    function renderPositivacaoData() {
      const { codigo, nome, freq, setor, produtos_tt, cerveja, nab, mkt, stela_pg, florestal } = state.posFilters;

      const pdvsFiltrados = state.dbPDVs.filter(p => {
        if (codigo && !String(p.codigo).toLowerCase().includes(codigo)) return false;
        if (nome && !String(p.nome).toLowerCase().includes(nome)) return false;
        if (freq !== 'TODOS' && p.frequencia !== freq) return false;
        if (setor !== 'TODOS' && p.setor !== setor) return false;
        if (produtos_tt !== 'TODOS' && p.produtos_tt !== produtos_tt) return false;
        if (cerveja !== 'TODOS' && p.cerveja !== cerveja) return false;
        if (nab !== 'TODOS' && p.nab !== nab) return false;
        if (mkt !== 'TODOS' && p.mkt !== mkt) return false;
        if (stela_pg !== 'TODOS' && p.stela_pg !== stela_pg) return false;
        if (florestal !== 'TODOS' && p.florestal !== florestal) return false;
        return true;
      });

      // Recalcular métricas dinamicamente com base no filtro ativo
      const totalPDVs = pdvsFiltrados.length || 1;

      const calcCat = (key) => {
        const okCount = pdvsFiltrados.filter(p => p[key] === 'OK').length;
        const nokCount = pdvsFiltrados.length - okCount;
        const pct = Math.round((okCount / totalPDVs) * 100);
        return { okCount, nokCount, pct };
      };

      const metrics = [
        { key: 'produtos_tt', name: 'PRODUTOS TT', ...calcCat('produtos_tt') },
        { key: 'cerveja', name: 'Cerveja', ...calcCat('cerveja') },
        { key: 'nab', name: 'NAB', ...calcCat('nab') },
        { key: 'mkt', name: 'Marketplace', ...calcCat('mkt') },
        { key: 'stela_pg', name: 'Stella / PG', ...calcCat('stela_pg') },
        { key: 'florestal', name: 'Florestal', ...calcCat('florestal') }
      ];

      const metricsContainer = document.getElementById('metrics-summary-container');
      if (metricsContainer) {
        metricsContainer.innerHTML = `
          <div class="exec-summary-box">
            <div>
              <div class="title">PAINEL EXECUTIVO (RECALCULADO EM TEMPO REAL)</div>
              <div style="font-size:14px; margin-top:4px;">Setor Filtro: <strong>${setor}</strong> | PDVs Exibidos: <strong>${pdvsFiltrados.length}</strong></div>
              <div style="font-size:12.5px; color:#cbd5e1; margin-top:2px;">Bateram Meta TT: <strong style="color:#4ade80;">${metrics[0].okCount}</strong> | Pendentes TT: <strong style="color:#f87171;">${metrics[0].nokCount}</strong></div>
            </div>
            <div style="text-align:right;">
              <div class="title">Atingimento Global (TT)</div>
              <div class="value-main">${metrics[0].pct}%</div>
            </div>
          </div>

          <div class="kpi-grid-exec" style="margin-top:12px;">
            ${metrics.map(m => `
              <div class="kpi-card-exec">
                <div class="lbl">${m.name}</div>
                <div class="val-percent">${m.pct}%</div>
                <div class="sub-details">
                  <span>OK: <strong>${m.okCount}</strong></span>
                  <span style="color:var(--danger);">NOK: <strong>${m.nokCount}</strong></span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${m.pct}%;"></div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      // Renderizar tabela de visualização
      const tbody = document.getElementById('pos-table-tbody');
      const lblTotal = document.getElementById('lbl-total-pos-filtrados');
      if (lblTotal) lblTotal.textContent = `(${pdvsFiltrados.length} PDVs visíveis)`;

      if (!tbody) return;
      tbody.innerHTML = '';

      if (pdvsFiltrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:20px; color:var(--text-muted);">Nenhum cliente/PDV corresponde aos filtros selecionados.</td></tr>`;
        return;
      }

      pdvsFiltrados.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>[${p.codigo}]</strong></td>
          <td>${p.nome}</td>
          <td>${p.frequencia || '-'}</td>
          <td>Setor ${p.setor || '-'}</td>
          <td><span class="tag-status ${p.produtos_tt === 'OK' ? 'ok' : 'nok'}">${p.produtos_tt}</span></td>
          <td><span class="tag-status ${p.cerveja === 'OK' ? 'ok' : 'nok'}">${p.cerveja}</span></td>
          <td><span class="tag-status ${p.nab === 'OK' ? 'ok' : 'nok'}">${p.nab}</span></td>
          <td><span class="tag-status ${p.mkt === 'OK' ? 'ok' : 'nok'}">${p.mkt}</span></td>
          <td><span class="tag-status ${p.stela_pg === 'OK' ? 'ok' : 'nok'}">${p.stela_pg}</span></td>
          <td><span class="tag-status ${p.florestal === 'OK' ? 'ok' : 'nok'}">${p.florestal}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

        texto += `${titleCust}:\n`;
        if (getChecked('op-custom')) texto += `*Operação:* ${document.getElementById('op-custom').value}\n`;
        if (getChecked('filial-custom')) texto += `*Filial:* ${document.getElementById('filial-custom').value}\n`;
        if (getChecked('rn-custom')) texto += `*Rn:* ${document.getElementById('rn-custom').value}\n`;
        if (getChecked('codpdv-custom')) texto += `*Cod PDV:* ${document.getElementById('codpdv-custom').value}\n`;
        if (getChecked('nome-custom')) texto += `*Nome Fantasia:* ${document.getElementById('nome-custom').value}\n`;
        if (getChecked('data-custom')) texto += `*Data:* ${formatarData(document.getElementById('data-custom').value)}\n`;
        if (getChecked('motivo-custom')) texto += `*Motivo:* ${document.getElementById('motivo-custom').value}\n`;
        if (getChecked('valor-custom')) texto += `*Valor/Limite:* ${document.getElementById('valor-custom').value}\n`;
        if (getChecked('obs-custom')) texto += `*Observações:* ${document.getElementById('obs-custom').value}\n`;
      }

      return texto;
    }

    async function enviarDiretoWhatsApp() {
      const texto = gerarTextoAtual();
      if (!texto.trim()) { alert('Preencha os campos antes de enviar.'); return; }

      const prefix = state.currentTab === 'bonificacao' ? 'boni' : (state.currentTab === 'desconto' ? 'desc' : state.currentTab);
      const inputFoto = document.getElementById(`foto-${prefix}`);
      const arquivoFoto = (inputFoto && inputFoto.files) ? inputFoto.files[0] : null;

      if (arquivoFoto && navigator.canShare && navigator.canShare({ files: [arquivoFoto] })) {
        try {
          await navigator.share({ text: texto, files: [arquivoFoto] });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }

    function adicionarItem() {
      const texto = gerarTextoAtual();
      if (!texto.trim()) { alert('Preencha pelo menos um campo marcado.'); return; }
      state.itens.push({ texto });
      salvarLoteStorage();
      atualizarSaida();
    }

    function atualizarSaida() {
      const saida = document.getElementById('saida');
      saida.innerHTML = '';
      state.itens.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'item-container';
        div.textContent = item.texto;
        const btn = document.createElement('button');
        btn.className = 'btn-del';
        btn.innerHTML = '&times;';
        btn.onclick = () => {
          state.itens.splice(i, 1);
          salvarLoteStorage();
          atualizarSaida();
        };
        div.appendChild(btn);
        saida.appendChild(div);
      });
    }

    function gerarWhatsapp() {
      if (state.itens.length === 0) { alert('Adicione itens ao lote antes de compartilhar.'); return; }
      const texto = state.itens.map(i => i.texto).join('\n---\n');
      window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }

    window.onload = async () => {
      carregarNomesAbas();
      await carregarPlanilhaDoDB();
      carregarLoteStorage();
      renderForm();
    };
  </script>
</body>
</html>
