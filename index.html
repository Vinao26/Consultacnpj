<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta CNPJ - API Pública</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- FUNÇÕES UTILITÁRIAS DE FORMATAÇÃO ---

    const formatCNPJ = (value) => {
      const digits = value.replace(/\D/g, '').slice(0, 14);
      return digits
        .replace(/^(\d{2})(\d)/, '$1.$2')
        .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
        .replace(/\.(\d{3})(\d)/, '.$1/$2')
        .replace(/(\d{4})(\d)/, '$1-$2');
    };

    const formatCEP = (cep) => {
      if (!cep) return '-';
      const digits = String(cep).replace(/\D/g, '').slice(0, 8);
      return digits.replace(/^(\d{5})(\d)/, '$1-$2');
    };

    const formatCurrency = (val) => {
      if (val === null || val === undefined || isNaN(Number(val))) return '-';
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(val));
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return '-';
      const parts = String(dateStr).split('T')[0].split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return dateStr;
    };

    const formatValue = (key, value) => {
      if (value === null || value === undefined) return '-';
      if (typeof value === 'boolean') return value ? 'Sim' : 'Não';

      const keyLower = key.toLowerCase();
      if (keyLower.includes('capital_social') || keyLower.includes('valorsocio')) {
        return formatCurrency(value);
      }
      if (keyLower.includes('data') || keyLower.includes('opened') || keyLower.includes('updated')) {
        return formatDate(value);
      }
      if (keyLower === 'cep') {
        return formatCEP(value);
      }
      return String(value);
    };

    const countFilledFields = (data) => {
      if (data === null || data === undefined) return 0;
      if (typeof data !== 'object') {
        return String(data).trim() !== '' ? 1 : 0;
      }
      let count = 0;
      for (const key in data) {
        if (Object.prototype.hasOwnProperty.call(data, key)) {
          count += countFilledFields(data[key]);
        }
      }
      return count;
    };

    // --- COMPONENTE DE RENDERIZAÇÃO DINÂMICA (RECURSIVA) ---

    const DynamicDataViewer = ({ data, level = 0 }) => {
      if (data === null || data === undefined) return <span className="text-gray-400 italic">Nulo</span>;

      if (Array.isArray(data)) {
        if (data.length === 0) return <span className="text-gray-400 italic">Lista vazia</span>;
        return (
          <div className="space-y-3 mt-2">
            {data.map((item, index) => (
              <div key={index} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                <span className="text-xs font-bold text-gray-500 uppercase block mb-1">Item #{index + 1}</span>
                <DynamicDataViewer data={item} level={level + 1} />
              </div>
            ))}
          </div>
        );
      }

      if (typeof data === 'object') {
        return (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-1">
            {Object.entries(data).map(([key, val]) => {
              const isComplex = typeof val === 'object' && val !== null;
              return (
                <div
                  key={key}
                  className={`p-2.5 rounded-lg border border-gray-100 bg-white ${
                    isComplex ? 'col-span-full bg-gray-50/50 p-3' : ''
                  }`}
                >
                  <span className="text-xs font-semibold text-gray-500 uppercase tracking-wider block">
                    {key.replace(/_/g, ' ')}
                  </span>
                  {isComplex ? (
                    <DynamicDataViewer data={val} level={level + 1} />
                  ) : (
                    <span className="text-sm text-gray-800 font-medium break-words">
                      {formatValue(key, val)}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        );
      }

      return <span className="text-sm text-gray-800 font-medium">{formatValue('', data)}</span>;
    };

    // --- COMPONENTE PRINCIPAL ---

    function ConsultaCNPJ() {
      const [cnpj, setCnpj] = useState('');
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [showRawJson, setShowRawJson] = useState(false);
      const [copied, setCopied] = useState(false);

      const handleInputChange = (e) => {
        setCnpj(formatCNPJ(e.target.value));
      };

      const handleSearch = async (e) => {
        e.preventDefault();
        const cleanCNPJ = cnpj.replace(/\D/g, '');

        if (cleanCNPJ.length !== 14) {
          setError('Por favor, informe um CNPJ válido com 14 dígitos.');
          return;
        }

        setLoading(true);
        setError(null);
        setData(null);

        try {
          const response = await fetch(`https://publica.cnpj.ws/cnpj/${cleanCNPJ}`);
          
          if (!response.ok) {
            if (response.status === 404) {
              throw new Error('CNPJ não encontrado na base de dados.');
            } else if (response.status === 429) {
              throw new Error('Limite de requisições atingido. Aguarde um instante e tente novamente.');
            }
            throw new Error(`Erro na consulta (${response.status}). Tente novamente mais tarde.`);
          }

          const json = await response.json();
          setData(json);
        } catch (err) {
          setError(err.message || 'Ocorreu um erro ao consultar o CNPJ.');
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = () => {
        if (!data) return;
        navigator.clipboard.writeText(JSON.stringify(data, null, 2));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* CABEÇALHO E BUSCA */}
            <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
              <div className="max-w-3xl mx-auto text-center space-y-3 mb-6">
                <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">
                  Consultar CNPJ
                </h1>
                <p className="text-slate-500 text-sm md:text-base">
                  Digite o número do CNPJ para buscar informações detalhadas e atualizadas via API pública.
                </p>
              </div>

              <form onSubmit={handleSearch} className="max-w-xl mx-auto flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  value={cnpj}
                  onChange={handleInputChange}
                  placeholder="00.000.000/0000-00"
                  className="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg text-slate-900 placeholder-slate-400 transition"
                  maxLength={18}
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="px-6 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-semibold rounded-xl shadow-md transition duration-200 flex items-center justify-center min-w-[140px]"
                >
                  {loading ? (
                    <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin" />
                  ) : (
                    'Consultar'
                  )}
                </button>
              </form>

              {error && (
                <div className="max-w-xl mx-auto mt-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm text-center">
                  {error}
                </div>
              )}
            </header>

            {/* EXIBIÇÃO DE RESULTADOS */}
            {data && (
              <main className="space-y-6">
                
                {/* CARD DE RESUMO PRINCIPAL */}
                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-6">
                    <div>
                      <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                        {data.estabelecimento?.tipo || 'Empresa'}
                      </span>
                      <h2 className="text-2xl font-bold text-slate-900">{data.razao_social}</h2>
                      {data.estabelecimento?.nome_fantasia && (
                        <p className="text-slate-500 font-medium">
                          {data.estabelecimento.nome_fantasia}
                        </p>
                      )}
                    </div>
                    <div>
                      <span
                        className={`inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${
                          data.estabelecimento?.situação_cadastral === 'Ativa' || data.estabelecimento?.situacao_cadastral === 'Ativa'
                            ? 'bg-emerald-100 text-emerald-800'
                            : 'bg-amber-100 text-amber-800'
                        }`}
                      >
                        Situação: {data.estabelecimento?.situação_cadastral || data.estabelecimento?.situacao_cadastral || 'Desconhecida'}
                      </span>
                    </div>
                  </div>

                  {/* GRID DE INFORMAÇÕES BÁSICAS */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div className="p-4 bg-slate-50 rounded-xl">
                      <span className="text-xs font-medium text-slate-400 uppercase">CNAE Principal</span>
                      <p className="text-sm font-semibold text-slate-800 mt-1">
                        {data.estabelecimento?.atividade_principal?.subclasse || '-'} - {data.estabelecimento?.atividade_principal?.descricao || '-'}
                      </p>
                    </div>

                    <div className="p-4 bg-slate-50 rounded-xl">
                      <span className="text-xs font-medium text-slate-400 uppercase">Endereço</span>
                      <p className="text-sm font-semibold text-slate-800 mt-1">
                        {data.estabelecimento?.tipo_logradouro} {data.estabelecimento?.logradouro}, {data.estabelecimento?.numero}
                        {data.estabelecimento?.complemento ? ` - ${data.estabelecimento.complemento}` : ''}
                      </p>
                      <p className="text-xs text-slate-500 mt-0.5">
                        {data.estabelecimento?.bairro} | CEP: {formatCEP(data.estabelecimento?.cep)}
                      </p>
                    </div>

                    <div className="p-4 bg-slate-50 rounded-xl">
                      <span className="text-xs font-medium text-slate-400 uppercase">Cidade / UF</span>
                      <p className="text-sm font-semibold text-slate-800 mt-1">
                        {data.estabelecimento?.cidade?.nome || '-'} / {data.estabelecimento?.estado?.sigla || '-'}
                      </p>
                    </div>

                    <div className="p-4 bg-slate-50 rounded-xl">
                      <span className="text-xs font-medium text-slate-400 uppercase">Contatos</span>
                      <p className="text-sm font-semibold text-slate-800 mt-1">
                        {data.estabelecimento?.ddd1 && data.estabelecimento?.telefone1
                          ? `(${data.estabelecimento.ddd1}) ${data.estabelecimento.telefone1}`
                          : 'Sem telefone'}
                      </p>
                      <p className="text-xs text-slate-500 truncate mt-0.5">
                        {data.estabelecimento?.email || 'Sem e-mail'}
                      </p>
                    </div>

                    <div className="p-4 bg-slate-50 rounded-xl">
                      <span className="text-xs font-medium text-slate-400 uppercase">Capital Social</span>
                      <p className="text-sm font-semibold text-slate-800 mt-1">
                        {formatCurrency(data.capital_social)}
                      </p>
                    </div>

                    <div className="p-4 bg-slate-50 rounded-xl">
                      <span className="text-xs font-medium text-slate-400 uppercase">Inscrições Estaduais</span>
                      <div className="text-sm font-semibold text-slate-800 mt-1 max-h-16 overflow-y-auto">
                        {data.estabelecimento?.inscricoes_estadual?.length > 0 ? (
                          data.estabelecimento.inscricoes_estadual.map((ie, i) => (
                            <div key={i} className="text-xs">
                              <span className="font-bold">{ie.inscricao_estadual}</span> ({ie.estado?.sigla || 'UF'}) - {ie.ativo ? 'Ativa' : 'Inativa'}
                            </div>
                          ))
                        ) : (
                          <span className="text-slate-400 text-xs">Nenhuma cadastrada</span>
                        )}
                      </div>
                    </div>
                  </div>
                </section>

                {/* BARRA DE AÇÕES & METADADOS */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200">
                  <div className="text-sm text-slate-600">
                    Total de campos preenchidos: <strong className="text-blue-600">{countFilledFields(data)}</strong>
                  </div>
                  <div className="flex gap-3 w-full sm:w-auto">
                    <button
                      onClick={() => setShowRawJson(!showRawJson)}
                      className="flex-1 sm:flex-none px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-medium rounded-lg transition"
                    >
                      {showRawJson ? 'Ocultar JSON Bruto' : 'Ver JSON Bruto'}
                    </button>
                    <button
                      onClick={copyToClipboard}
                      className="flex-1 sm:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-lg transition"
                    >
                      {copied ? 'Copiado!' : 'Copiar JSON'}
                    </button>
                  </div>
                </div>

                {/* VISUALIZADOR DE JSON BRUTO */}
                {showRawJson && (
                  <section className="bg-slate-900 text-slate-100 p-4 rounded-xl font-mono text-xs overflow-x-auto max-h-96 shadow-inner">
                    <pre>{JSON.stringify(data, null, 2)}</pre>
                  </section>
                )}

                {/* SEÇÃO DINÂMICA RECURSIVA */}
                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-4">
                  <div className="border-b border-slate-100 pb-3">
                    <h3 className="text-xl font-bold text-slate-900">
                      Estrutura Completa de Dados
                    </h3>
                    <p className="text-xs text-slate-500 mt-1">
                      Mapeamento dinâmico e automático de todas as propriedades retornadas pela API.
                    </p>
                  </div>
                  
                  <DynamicDataViewer data={data} />
                </section>

              </main>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConsultaCNPJ />);
  </script>
</body>
</html>
