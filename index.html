<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta CNPJ - API Pública</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <!-- Babel Standalone para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- html2pdf.js para exportação direta de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    @media print {
      body {
        background-color: #ffffff !important;
      }
      .no-print {
        display: none !important;
      }
      .print-shadow-none {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
    }

    /* PREVENÇÃO DE CORTE DE PÁGINA NO PDF */
    .pdf-no-break {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }

    /* ESTILOS DO CARTÃO CNPJ OFICIAL */
    .cnpj-card-box {
      border: 1px solid #000;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
      width: 100%;
      box-sizing: border-box;
    }
    .cnpj-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: -1px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .cnpj-td {
      border: 1px solid #000;
      padding: 3px 5px;
      vertical-align: top;
    }
    .cnpj-label {
      font-size: 7.5px;
      font-weight: bold;
      text-transform: uppercase;
      color: #000;
      display: block;
      margin-bottom: 2px;
    }
    .cnpj-val {
      font-size: 9.5px;
      font-weight: bold;
      color: #000;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1.2;
    }

    /* ESTILOS DO SINTEGRA */
    .sintegra-container {
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
      background: #fff;
      width: 190mm;
      padding: 4mm;
      box-sizing: border-box;
    }
    .sintegra-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 6px;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .sintegra-header-cell {
      background-color: #808080;
      color: #ffffff;
      font-size: 9px;
      font-weight: bold;
      padding: 3px 5px;
      text-align: left;
      text-transform: uppercase;
      border: 1px solid #000;
    }
    .sintegra-td {
      border: 1px solid #7f7f7f;
      padding: 3px 5px;
      vertical-align: top;
      background-color: #fff;
    }
    .sintegra-label {
      font-size: 8px;
      color: #333;
      display: inline-block;
      text-transform: uppercase;
      font-weight: bold;
    }
    .sintegra-val {
      font-size: 8.5px;
      font-weight: normal;
      color: #000;
      text-transform: uppercase;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- FUNÇÕES UTILITÁRIAS DE FORMATAÇÃO ---

    const formatCNPJ = (value) => {
      if (!value) return '';
      const digits = String(value).replace(/\D/g, '').slice(0, 14);
      return digits
        .replace(/^(\d{2})(\d)/, '$1.$2')
        .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
        .replace(/\.(\d{3})(\d)/, '.$1/$2')
        .replace(/(\d{4})(\d)/, '$1-$2');
    };

    const formatCEP = (cep) => {
      if (!cep) return '';
      const digits = String(cep).replace(/\D/g, '').slice(0, 8);
      return digits.replace(/^(\d{5})(\d)/, '$1-$2');
    };

    const formatCurrency = (val) => {
      if (val === null || val === undefined || isNaN(Number(val))) return '-';
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(val));
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      const parts = String(dateStr).split('T')[0].split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return dateStr;
    };

    const formatValue = (key, value) => {
      if (value === null || value === undefined) return '-';
      if (typeof value === 'boolean') return value ? 'Sim' : 'Não';

      const keyLower = key.toLowerCase();
      if (keyLower.includes('capital_social') || keyLower.includes('valorsocio')) {
        return formatCurrency(value);
      }
      if (keyLower.includes('data') || keyLower.includes('opened') || keyLower.includes('updated')) {
        return formatDate(value);
      }
      if (keyLower === 'cep') {
        return formatCEP(value);
      }
      return String(value);
    };

    const countFilledFields = (data) => {
      if (data === null || data === undefined) return 0;
      if (typeof data !== 'object') {
        return String(data).trim() !== '' ? 1 : 0;
      }
      let count = 0;
      for (const key in data) {
        if (Object.prototype.hasOwnProperty.call(data, key)) {
          count += countFilledFields(data[key]);
        }
      }
      return count;
    };

    // --- COMPONENTE DE RENDERIZAÇÃO DINÂMICA (RECURSIVA) ---

    const DynamicDataViewer = ({ data, level = 0 }) => {
      if (data === null || data === undefined) return <span className="text-gray-400 italic">Nulo</span>;

      if (Array.isArray(data)) {
        if (data.length === 0) return <span className="text-gray-400 italic">Lista vazia</span>;
        return (
          <div className="space-y-3 mt-2">
            {data.map((item, index) => (
              <div key={index} className="p-3 bg-gray-50 rounded-lg border border-gray-200 pdf-no-break">
                <span className="text-xs font-bold text-gray-500 uppercase block mb-1">Item #{index + 1}</span>
                <DynamicDataViewer data={item} level={level + 1} />
              </div>
            ))}
          </div>
        );
      }

      if (typeof data === 'object') {
        return (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-1">
            {Object.entries(data).map(([key, val]) => {
              const isComplex = typeof val === 'object' && val !== null;
              return (
                <div
                  key={key}
                  className={`p-2.5 rounded-lg border border-gray-100 bg-white pdf-no-break ${
                    isComplex ? 'col-span-full bg-gray-50/50 p-3' : ''
                  }`}
                >
                  <span className="text-xs font-semibold text-gray-500 uppercase tracking-wider block">
                    {key.replace(/_/g, ' ')}
                  </span>
                  {isComplex ? (
                    <DynamicDataViewer data={val} level={level + 1} />
                  ) : (
                    <span className="text-sm text-gray-800 font-medium break-words">
                      {formatValue(key, val)}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        );
      }

      return <span className="text-sm text-gray-800 font-medium">{formatValue('', data)}</span>;
    };

    // --- COMPONENTE PRINCIPAL ---

    function ConsultaCNPJ() {
      const [cnpj, setCnpj] = useState('');
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [generatingPdf, setGeneratingPdf] = useState(false);
      const [pdfType, setPdfType] = useState('');
      const [error, setError] = useState(null);
      const [showRawJson, setShowRawJson] = useState(false);
      const [copied, setCopied] = useState(false);

      const [cooldown, setCooldown] = useState(0);
      const timerRef = useRef(null);

      useEffect(() => {
        if (cooldown > 0) {
          timerRef.current = setInterval(() => {
            setCooldown((prev) => prev - 1);
          }, 1000);
        } else if (cooldown === 0 && timerRef.current) {
          clearInterval(timerRef.current);
        }

        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [cooldown]);

      const handleInputChange = (e) => {
        setCnpj(formatCNPJ(e.target.value));
      };

      const handleSearch = async (e) => {
        e.preventDefault();

        if (cooldown > 0) return;

        const cleanCNPJ = cnpj.replace(/\D/g, '');

        if (cleanCNPJ.length !== 14) {
          setError('Por favor, informe um CNPJ válido com 14 dígitos.');
          return;
        }

        setLoading(true);
        setError(null);
        setData(null);

        try {
          const response = await fetch(`https://publica.cnpj.ws/cnpj/${cleanCNPJ}`);
          
          if (!response.ok) {
            if (response.status === 404) {
              throw new Error('CNPJ não encontrado na base de dados.');
            } else if (response.status === 429) {
              throw new Error('Limite de requisições atingido na API. Aguarde antes de tentar novamente.');
            }
            throw new Error(`Erro na consulta (${response.status}). Tente novamente mais tarde.`);
          }

          const json = await response.json();
          setData(json);

          setCooldown(60);
        } catch (err) {
          setError(err.message || 'Ocorreu um erro ao consultar o CNPJ.');
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = () => {
        if (!data) return;
        navigator.clipboard.writeText(JSON.stringify(data, null, 2));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handlePrint = () => {
        window.print();
      };

      // 📄 EXPORTAÇÃO DE PDF REFINADA COM QUEBRA LIMPA
      const generatePDF = (elementId, filename, type) => {
        if (!data) return;
        setGeneratingPdf(true);
        setPdfType(type);

        setTimeout(() => {
          const element = document.getElementById(elementId);
          const opt = {
            margin: [5, 5, 5, 5],
            filename: filename,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'] }
          };

          html2pdf().set(opt).from(element).save().then(() => {
            setGeneratingPdf(false);
            setPdfType('');
          }).catch((err) => {
            console.error(err);
            setGeneratingPdf(false);
            setPdfType('');
          });
        }, 300);
      };

      const handleExportPDF = () => {
        const formattedCnpj = data.estabelecimento?.cnpj || cnpj.replace(/\D/g, '');
        generatePDF('ficha-cadastral-content', `ficha-cadastral-cnpj-${formattedCnpj}.pdf`, 'ficha');
      };

      const handleExportCartaoCNPJ = () => {
        const formattedCnpj = data.estabelecimento?.cnpj || cnpj.replace(/\D/g, '');
        generatePDF('cartao-cnpj-template', `cartao-cnpj-${formattedCnpj}.pdf`, 'cartao');
      };

      const handleExportSintegra = () => {
        const formattedCnpj = data.estabelecimento?.cnpj || cnpj.replace(/\D/g, '');
        generatePDF('sintegra-template', `sintegra-comprovante-${formattedCnpj}.pdf`, 'sintegra');
      };

      const handleShareWhatsApp = () => {
        if (!data) return;
        
        const razao = data.razao_social || 'Empresa';
        const fantasia = data.estabelecimento?.nome_fantasia ? ` (${data.estabelecimento.nome_fantasia})` : '';
        const cnpjNum = formatCNPJ(data.estabelecimento?.cnpj || cnpj);
        const situacao = (data.estabelecimento?.situação_cadastral || data.estabelecimento?.situacao_cadastral || 'NÃO INFORMADA').toUpperCase();
        const cidadeUf = `${data.estabelecimento?.cidade?.nome || '-'}/${data.estabelecimento?.estado?.sigla || '-'}`;
        const cnae = `${data.estabelecimento?.atividade_principal?.subclasse || '-'} - ${data.estabelecimento?.atividade_principal?.descricao || '-'}`;
        const telefone = data.estabelecimento?.ddd1 && data.estabelecimento?.telefone1 
          ? `(${data.estabelecimento.ddd1}) ${data.estabelecimento.telefone1}` 
          : 'Não informado';

        const text = `*Ficha Cadastral de CNPJ*\n\n` +
          `🏢 *Razão Social:* ${razao}${fantasia}\n` +
          `🔢 *CNPJ:* ${cnpjNum}\n` +
          `📌 *Situação:* ${situacao}\n` +
          `📍 *Cidade/UF:* ${cidadeUf}\n` +
          `💼 *CNAE Principal:* ${cnae}\n` +
          `📞 *Telefone:* ${telefone}\n\n` +
          `_Consulte e exporte a ficha completa em PDF._`;

        const encodedText = encodeURIComponent(text);
        window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
      };

      // EXTRAÇÃO DE DADOS PARA OS TEMPLATES
      const formattedCnpjVal = formatCNPJ(data?.estabelecimento?.cnpj || cnpj);
      const dataAbertura = formatDate(data?.estabelecimento?.data_inicio_atividade);
      const razaoSocial = data?.razao_social || '-';
      const nomeFantasia = data?.estabelecimento?.nome_fantasia || '********';
      const porte = data?.porte?.descricao || '-';
      
      const cnaeCode = data?.estabelecimento?.atividade_principal?.subclasse || '';
      const cnaeDesc = data?.estabelecimento?.atividade_principal?.descricao || '';
      const cnaePrincipalFormatted = cnaeCode ? `${cnaeCode.replace(/^(\d{2})(\d{2})(\d{1})(\d{2})$/, '$1.$2-$3-$4')} - ${cnaeDesc}` : '-';

      const cnaesSecundariosList = data?.estabelecimento?.atividades_secundarias || [];

      const naturezaJuridica = data?.natureza_juridica 
        ? `${data.natureza_juridica.id || ''} - ${data.natureza_juridica.descricao}`
        : '-';

      const tipoLogradouro = data?.estabelecimento?.tipo_logradouro || '';
      const logradouroNome = data?.estabelecimento?.logradouro || '';
      const logradouro = `${tipoLogradouro} ${logradouroNome}`.trim();
      const numero = data?.estabelecimento?.numero || 'S/N';
      const complemento = data?.estabelecimento?.complemento || '';
      const cep = formatCEP(data?.estabelecimento?.cep);
      const bairro = data?.estabelecimento?.bairro || '-';
      const municipio = data?.estabelecimento?.cidade?.nome || '-';
      const uf = data?.estabelecimento?.estado?.sigla || '-';
      const email = (data?.estabelecimento?.email || '').toLowerCase();
      const ddd1 = data?.estabelecimento?.ddd1 || '';
      const tel1 = data?.estabelecimento?.telefone1 || '';
      const ddd2 = data?.estabelecimento?.ddd2 || '';
      const tel2 = data?.estabelecimento?.telefone2 || '';
      const telefone = ddd1 && tel1 
        ? `(${ddd1}) ${tel1}` + (ddd2 && tel2 ? ` / (${ddd2}) ${tel2}` : '') 
        : '-';

      // FIDELIDADE DA SITUAÇÃO CADASTRAL DA API
      const situacaoCadastral = (data?.estabelecimento?.situação_cadastral || data?.estabelecimento?.situacao_cadastral || 'NÃO INFORMADA').toUpperCase();
      const dataSituacao = formatDate(data?.estabelecimento?.data_situacao_cadastral || data?.estabelecimento?.updated_at);
      
      // Inscrição Estadual vinda da API se houver (se não houver, fica em branco/não inventado)
      const iePrincipal = data?.estabelecimento?.inscricoes_estadual?.length > 0 
        ? data.estabelecimento.inscricoes_estadual[0].inscricao_estadual 
        : '-';

      const now = new Date();
      const currentDateStr = formatDate(now.toISOString());
      const currentTimeStr = now.toTimeString().split(' ')[0];

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* CABEÇALHO E BUSCA */}
            <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 no-print">
              <div className="max-w-3xl mx-auto text-center space-y-3 mb-6">
                <h1 className="text-3xl font-extrabold text-slate-900 tracking-tight">
                  Consultar CNPJ
                </h1>
                <p className="text-slate-500 text-sm md:text-base">
                  Digite o número do CNPJ para buscar informações detalhadas e atualizadas via API pública.
                </p>
              </div>

              <form onSubmit={handleSearch} className="max-w-xl mx-auto flex flex-col sm:flex-row gap-3">
                <input
                  type="text"
                  value={cnpj}
                  onChange={handleInputChange}
                  placeholder="00.000.000/0000-00"
                  className="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg text-slate-900 placeholder-slate-400 transition"
                  maxLength={18}
                />
                <button
                  type="submit"
                  disabled={loading || cooldown > 0}
                  className="px-6 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-md transition duration-200 flex items-center justify-center min-w-[170px]"
                >
                  {loading ? (
                    <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin" />
                  ) : cooldown > 0 ? (
                    <span className="text-slate-600 text-sm font-medium">
                      Aguarde {cooldown}s
                    </span>
                  ) : (
                    'Consultar'
                  )}
                </button>
              </form>

              {cooldown > 0 && (
                <p className="text-xs text-amber-600 text-center mt-3 font-medium">
                  ⏳ Por proteção contra instabilidade na API, aguarde {cooldown} segundos para uma nova consulta.
                </p>
              )}

              {error && (
                <div className="max-w-xl mx-auto mt-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm text-center">
                  {error}
                </div>
              )}
            </header>

            {/* EXIBIÇÃO DE RESULTADOS */}
            {data && (
              <main className="space-y-6">
                
                {/* BARRA DE AÇÕES */}
                <div className="no-print bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                  <div className="text-sm font-semibold text-slate-700">
                    Ações & Exportações:
                  </div>
                  <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                    <button
                      onClick={handlePrint}
                      className="flex-1 sm:flex-none px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 border border-slate-300"
                    >
                      <span>🖨️</span>
                      <span>Imprimir</span>
                    </button>

                    <button
                      onClick={handleExportPDF}
                      disabled={generatingPdf}
                      className="flex-1 sm:flex-none px-3 py-2 bg-red-600 hover:bg-red-700 disabled:bg-red-300 text-white text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <span>📄</span>
                      <span>{generatingPdf && pdfType === 'ficha' ? 'Gerando...' : 'Ficha PDF'}</span>
                    </button>

                    <button
                      onClick={handleExportCartaoCNPJ}
                      disabled={generatingPdf}
                      className="flex-1 sm:flex-none px-3 py-2 bg-blue-700 hover:bg-blue-800 disabled:bg-blue-300 text-white text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <span>🏛️</span>
                      <span>{generatingPdf && pdfType === 'cartao' ? 'Gerando Cartão...' : 'Cartão CNPJ'}</span>
                    </button>

                    <button
                      onClick={handleExportSintegra}
                      disabled={generatingPdf}
                      className="flex-1 sm:flex-none px-3 py-2 bg-indigo-700 hover:bg-indigo-800 disabled:bg-indigo-300 text-white text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <span>🏢</span>
                      <span>{generatingPdf && pdfType === 'sintegra' ? 'Gerando Sintegra...' : 'Sintegra'}</span>
                    </button>

                    <button
                      onClick={handleShareWhatsApp}
                      className="flex-1 sm:flex-none px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <span>💬</span>
                      <span>WhatsApp</span>
                    </button>
                  </div>
                </div>

                {/* CONTEÚDO DA FICHA CADASTRAL */}
                <div id="ficha-cadastral-content" className="space-y-6">
                  
                  {/* CARD DE RESUMO PRINCIPAL */}
                  <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6 print-shadow-none pdf-no-break">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-6">
                      <div>
                        <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                          {data.estabelecimento?.tipo || 'Empresa'}
                        </span>
                        <h2 className="text-2xl font-bold text-slate-900">{data.razao_social}</h2>
                        {data.estabelecimento?.nome_fantasia && (
                          <p className="text-slate-500 font-medium">
                            {data.estabelecimento.nome_fantasia}
                          </p>
                        )}
                      </div>
                      <div>
                        <span
                          className={`inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${
                            situacaoCadastral === 'ATIVA'
                              ? 'bg-emerald-100 text-emerald-800'
                              : 'bg-red-100 text-red-800'
                          }`}
                        >
                          Situação: {situacaoCadastral}
                        </span>
                      </div>
                    </div>

                    {/* GRID DE INFORMAÇÕES BÁSICAS */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      <div className="p-4 bg-slate-50 rounded-xl pdf-no-break">
                        <span className="text-xs font-medium text-slate-400 uppercase">CNAE Principal</span>
                        <p className="text-sm font-semibold text-slate-800 mt-1">
                          {cnaePrincipalFormatted}
                        </p>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl pdf-no-break">
                        <span className="text-xs font-medium text-slate-400 uppercase">Endereço</span>
                        <p className="text-sm font-semibold text-slate-800 mt-1">
                          {logradouro}, {numero} {complemento ? `- ${complemento}` : ''}
                        </p>
                        <p className="text-xs text-slate-500 mt-0.5">
                          {bairro} | CEP: {cep}
                        </p>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl pdf-no-break">
                        <span className="text-xs font-medium text-slate-400 uppercase">Cidade / UF</span>
                        <p className="text-sm font-semibold text-slate-800 mt-1">
                          {municipio} / {uf}
                        </p>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl pdf-no-break">
                        <span className="text-xs font-medium text-slate-400 uppercase">Contatos</span>
                        <p className="text-sm font-semibold text-slate-800 mt-1">
                          {telefone}
                        </p>
                        <p className="text-xs text-slate-500 truncate mt-0.5">
                          {email || '-'}
                        </p>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl pdf-no-break">
                        <span className="text-xs font-medium text-slate-400 uppercase">Capital Social</span>
                        <p className="text-sm font-semibold text-slate-800 mt-1">
                          {formatCurrency(data.capital_social)}
                        </p>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl pdf-no-break">
                        <span className="text-xs font-medium text-slate-400 uppercase">Inscrições Estaduais</span>
                        <div className="text-sm font-semibold text-slate-800 mt-1 max-h-16 overflow-y-auto">
                          {data.estabelecimento?.inscricoes_estadual?.length > 0 ? (
                            data.estabelecimento.inscricoes_estadual.map((ie, i) => (
                              <div key={i} className="text-xs">
                                <span className="font-bold">{ie.inscricao_estadual}</span> ({ie.estado?.sigla || 'UF'}) - {ie.ativo ? 'Ativa' : 'Inativa'}
                              </div>
                            ))
                          ) : (
                            <span className="text-slate-400 text-xs">Nenhuma cadastrada</span>
                          )}
                        </div>
                      </div>
                    </div>
                  </section>

                  {/* SEÇÃO DINÂMICA RECURSIVA */}
                  <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-4 print-shadow-none">
                    <div className="border-b border-slate-100 pb-3">
                      <h3 className="text-xl font-bold text-slate-900">
                        Estrutura Completa de Dados
                      </h3>
                      <p className="text-xs text-slate-500 mt-1">
                        Mapeamento dinâmico e automático de todas as propriedades retornadas pela API.
                      </p>
                    </div>
                    
                    <DynamicDataViewer data={data} />
                  </section>
                </div>

                {/* METADADOS */}
                <div className="no-print flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <div className="text-sm text-slate-600">
                    Total de campos preenchidos: <strong className="text-blue-600">{countFilledFields(data)}</strong>
                  </div>
                  <div className="flex gap-3 w-full sm:w-auto">
                    <button
                      onClick={() => setShowRawJson(!showRawJson)}
                      className="flex-1 sm:flex-none px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-medium rounded-lg transition"
                    >
                      {showRawJson ? 'Ocultar JSON Bruto' : 'Ver JSON Bruto'}
                    </button>
                    <button
                      onClick={copyToClipboard}
                      className="flex-1 sm:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-lg transition"
                    >
                      {copied ? 'Copiado!' : 'Copiar JSON'}
                    </button>
                  </div>
                </div>

                {/* VISUALIZADOR DE JSON BRUTO */}
                {showRawJson && (
                  <section className="no-print bg-slate-900 text-slate-100 p-4 rounded-xl font-mono text-xs overflow-x-auto max-h-96 shadow-inner">
                    <pre>{JSON.stringify(data, null, 2)}</pre>
                  </section>
                )}

                {/* ========================================================================= */}
                {/* TEMPLATE OCULTO PARA GERAÇÃO DO PDF CARTÃO CNPJ                             */}
                {/* ========================================================================= */}
                <div className="overflow-hidden h-0 w-0">
                  <div id="cartao-cnpj-template" style={{ width: '190mm', padding: '2mm', background: '#fff', fontSize: '9px', color: '#000', fontFamily: 'Arial, sans-serif' }}>
                    <div style={{ border: '1px solid #000', padding: '3px' }}>
                      
                      {/* CABEÇALHO DA RECEITA FEDERAL */}
                      <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '4px' }} className="pdf-no-break">
                        <tbody>
                          <tr>
                            <td style={{ width: '50px', textAlign: 'center', verticalAlign: 'middle' }}>
                              <img src="https://solucoes.receita.fazenda.gov.br/Servicos/cnpjreva/images/brasao2.gif" alt="Brasão" style={{ width: '42px' }} />
                            </td>
                            <td style={{ textAlign: 'center', verticalAlign: 'middle' }}>
                              <div style={{ fontSize: '13px', fontWeight: 'bold', letterSpacing: '0.2px' }}>REPÚBLICA FEDERATIVA DO BRASIL</div>
                              <div style={{ fontSize: '13px', fontWeight: 'bold', marginTop: '3px', letterSpacing: '0.2px' }}>CADASTRO NACIONAL DA PESSOA JURÍDICA</div>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* NÚMERO DE INSCRIÇÃO / COMPROVANTE / DATA DE ABERTURA */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td" style={{ width: '36%' }}>
                              <span className="cnpj-label">NÚMERO DE INSCRIÇÃO</span>
                              <span className="cnpj-val">{formattedCnpjVal}</span><br/>
                              <span className="cnpj-val" style={{ fontSize: '8.5px' }}>{data.estabelecimento?.tipo === 'Matriz' ? 'MATRIZ' : 'FILIAL'}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '42%', textAlign: 'center', verticalAlign: 'middle' }}>
                              <span style={{ fontSize: '10px', fontWeight: 'bold' }}>COMPROVANTE DE INSCRIÇÃO E DE SITUAÇÃO CADASTRAL</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '22%' }}>
                              <span className="cnpj-label">DATA DE ABERTURA</span>
                              <span className="cnpj-val">{dataAbertura || '-'}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* NOME EMPRESARIAL */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td">
                              <span className="cnpj-label">NOME EMPRESARIAL</span>
                              <span className="cnpj-val">{razaoSocial}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* TÍTULO DO ESTABELECIMENTO / PORTE */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td" style={{ width: '82%' }}>
                              <span className="cnpj-label">TÍTULO DO ESTABELECIMENTO (NOME DE FANTASIA)</span>
                              <span className="cnpj-val">{nomeFantasia}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '18%' }}>
                              <span className="cnpj-label">PORTE</span>
                              <span className="cnpj-val">{porte}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* CNAE PRINCIPAL */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td">
                              <span className="cnpj-label">CÓDIGO E DESCRIÇÃO DA ATIVIDADE ECONÔMICA PRINCIPAL</span>
                              <span className="cnpj-val">{cnaePrincipalFormatted}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* CNAE SECUNDÁRIOS */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td">
                              <span className="cnpj-label">CÓDIGO E DESCRIÇÃO DAS ATIVIDADES ECONÔMICAS SECUNDÁRIAS</span>
                              {cnaesSecundariosList.length > 0 ? (
                                <div style={{ fontSize: '8.5px', fontWeight: 'bold', color: '#000', lineHeight: '1.2' }}>
                                  {cnaesSecundariosList.map((sec, idx) => {
                                    const sub = sec.subclasse ? sec.subclasse.replace(/^(\d{2})(\d{2})(\d{1})(\d{2})$/, '$1.$2-$3-$4') : '';
                                    return (
                                      <div key={idx} style={{ marginBottom: '2px' }}>
                                        {sub} - {sec.descricao}
                                      </div>
                                    );
                                  })}
                                </div>
                              ) : (
                                <span className="cnpj-val" style={{ fontWeight: 'normal' }}>Não informada</span>
                              )}
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* NATUREZA JURÍDICA */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td">
                              <span className="cnpj-label">CÓDIGO E DESCRIÇÃO DA NATUREZA JURÍDICA</span>
                              <span className="cnpj-val">{naturezaJuridica}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* ENDEREÇO */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td" style={{ width: '52%' }}>
                              <span className="cnpj-label">LOGRADOURO</span>
                              <span className="cnpj-val">{logradouro || '-'}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '18%' }}>
                              <span className="cnpj-label">NÚMERO</span>
                              <span className="cnpj-val">{numero}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '30%' }}>
                              <span className="cnpj-label">COMPLEMENTO</span>
                              <span className="cnpj-val">{complemento || '********'}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* CEP / BAIRRO / MUNICÍPIO / UF */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td" style={{ width: '22%' }}>
                              <span className="cnpj-label">CEP</span>
                              <span className="cnpj-val">{cep || '-'}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '32%' }}>
                              <span className="cnpj-label">BAIRRO/DISTRITO</span>
                              <span className="cnpj-val">{bairro}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '38%' }}>
                              <span className="cnpj-label">MUNICÍPIO</span>
                              <span className="cnpj-val">{municipio}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '8%' }}>
                              <span className="cnpj-label">UF</span>
                              <span className="cnpj-val">{uf}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* CONTATO */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td" style={{ width: '58%' }}>
                              <span className="cnpj-label">ENDEREÇO ELETRÔNICO</span>
                              <span className="cnpj-val">{email || '-'}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '42%' }}>
                              <span className="cnpj-label">TELEFONE</span>
                              <span className="cnpj-val">{telefone}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* EFR */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td">
                              <span className="cnpj-label">ENTE FEDERATIVO RESPONSÁVEL (EFR)</span>
                              <span className="cnpj-val">*****</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* SITUAÇÃO CADASTRAL DA API */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td" style={{ width: '70%' }}>
                              <span className="cnpj-label">SITUAÇÃO CADASTRAL</span>
                              <span className="cnpj-val">{situacaoCadastral}</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '30%' }}>
                              <span className="cnpj-label">DATA DA SITUAÇÃO CADASTRAL</span>
                              <span className="cnpj-val">{dataSituacao || '-'}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* MOTIVO SITUAÇÃO CADASTRAL */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td">
                              <span className="cnpj-label">MOTIVO DE SITUAÇÃO CADASTRAL</span>
                              <span className="cnpj-val">{data.estabelecimento?.motivo_situacao_cadastral?.descricao || ''}</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                      {/* SITUAÇÃO ESPECIAL */}
                      <table className="cnpj-table pdf-no-break">
                        <tbody>
                          <tr>
                            <td className="cnpj-td" style={{ width: '70%' }}>
                              <span className="cnpj-label">SITUAÇÃO ESPECIAL</span>
                              <span className="cnpj-val">********</span>
                            </td>
                            <td className="cnpj-td" style={{ width: '30%' }}>
                              <span className="cnpj-label">DATA DA SITUAÇÃO ESPECIAL</span>
                              <span className="cnpj-val">********</span>
                            </td>
                          </tr>
                        </tbody>
                      </table>

                    </div>

                    {/* RODAPÉ DO CARTÃO CNPJ */}
                    <div style={{ marginTop: '10px', fontSize: '8.5px', fontFamily: 'Arial, sans-serif' }} className="pdf-no-break">
                      <p style={{ margin: 0 }}>Aprovado pela Instrução Normativa RFB nº 2.119, de 06 de dezembro de 2022.</p>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '4px' }}>
                        <span>Emitido no dia <strong>{currentDateStr}</strong> às <strong>{currentTimeStr}</strong> (data e hora de Brasília).</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* ========================================================================= */}
                {/* TEMPLATE OCULTO PARA GERAÇÃO DO PDF SINTEGRA                                */}
                {/* ========================================================================= */}
                <div className="overflow-hidden h-0 w-0">
                  <div id="sintegra-template" className="sintegra-container">
                    
                    {/* CABEÇALHO DO SINTEGRA RO */}
                    <div className="pdf-no-break" style={{ display: 'flex', alignItems: 'flex-start', gap: '8px', marginBottom: '8px' }}>
                      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                        <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#c29b38', fontStyle: 'italic', fontFamily: 'Georgia, serif', lineHeight: '0.9' }}>S</div>
                        <span style={{ fontSize: '13px', fontWeight: 'bold', color: '#8c7329', letterSpacing: '-0.5px' }}>SINTEGRA</span>
                      </div>
                      <div style={{ flex: 1, paddingLeft: '6px' }}>
                        <h2 style={{ fontSize: '13px', fontWeight: 'bold', margin: 0, textTransform: 'uppercase', color: '#000' }}>
                          CONSULTA PÚBLICA À REDESIM
                        </h2>
                        <div style={{ fontSize: '8.5px', marginTop: '2px', color: '#000' }}>
                          Data e Hora: {currentDateStr} {currentTimeStr}
                        </div>
                      </div>
                    </div>

                    {/* SEÇÃO 1: IDENTIFICAÇÃO */}
                    <table className="sintegra-table pdf-no-break">
                      <thead>
                        <tr>
                          <th colSpan="2" className="sintegra-header-cell">IDENTIFICAÇÃO</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td className="sintegra-td" style={{ width: '50%' }}>
                            <span className="sintegra-label">C.P.F/C.N.P.J:</span> <span className="sintegra-val">{formattedCnpjVal}</span>
                          </td>
                          <td className="sintegra-td" style={{ width: '50%' }}>
                            <span className="sintegra-label">Inscrição Estadual:</span> <span className="sintegra-val">{iePrincipal}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td">
                            <span className="sintegra-label">Nire:</span> <span className="sintegra-val">-</span>
                          </td>
                          <td className="sintegra-td">
                            <span className="sintegra-label">Licença Bombeiros:</span> <span className="sintegra-val">-</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td">
                            <span className="sintegra-label">Insc.Municipal(ISS):</span> <span className="sintegra-val">-</span>
                          </td>
                          <td className="sintegra-td">
                            <span className="sintegra-label">Insc. Imobiliária :</span> <span className="sintegra-val">-</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">Razão Social:</span> <span className="sintegra-val">{razaoSocial}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">Nome Fantasia:</span> <span className="sintegra-val">{nomeFantasia !== '********' ? nomeFantasia : '-'}</span>
                          </td>
                        </tr>
                      </tbody>
                    </table>

                    {/* SEÇÃO 2: ENDEREÇO DA EMPRESA */}
                    <table className="sintegra-table pdf-no-break">
                      <thead>
                        <tr>
                          <th colSpan="2" className="sintegra-header-cell">ENDEREÇO DA EMPRESA</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">Endereço:</span> <span className="sintegra-val">{logradouro || '-'}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">Complemento:</span> <span className="sintegra-val">{complemento || '-'}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" style={{ width: '55%' }}>
                            <span className="sintegra-label">Bairro:</span> <span className="sintegra-val">{bairro}</span>
                          </td>
                          <td className="sintegra-td" style={{ width: '45%' }}>
                            <span className="sintegra-label">Número:</span> <span className="sintegra-val">{numero}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td">
                            <span className="sintegra-label">Município:</span> <span className="sintegra-val">{municipio}</span>
                          </td>
                          <td className="sintegra-td">
                            <span className="sintegra-label">CEP:</span> <span className="sintegra-val">{cep || '-'}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">UF:</span> <span className="sintegra-val">{uf}</span>
                          </td>
                        </tr>
                      </tbody>
                    </table>

                    {/* SEÇÃO 3: INFORMAÇÕES COMPLEMENTARES DA API */}
                    <table className="sintegra-table pdf-no-break">
                      <thead>
                        <tr>
                          <th colSpan="2" className="sintegra-header-cell">INFORMAÇÕES COMPLEMENTARES</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td className="sintegra-td" style={{ width: '70%' }}>
                            <span className="sintegra-label">Situação Cadastral:</span> <span className="sintegra-val" style={{ fontWeight: 'bold' }}>{situacaoCadastral}</span>
                          </td>
                          <td className="sintegra-td" style={{ width: '30%' }}>
                            <span className="sintegra-label">Data:</span> <span className="sintegra-val">{dataSituacao || '-'}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">Data Inicio Atividade:</span> <span className="sintegra-val">{dataAbertura || '-'}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">Código da Atividade Principal:</span> <span className="sintegra-val">{cnaeCode || '-'}</span>
                          </td>
                        </tr>
                        <tr>
                          <td className="sintegra-td" colSpan="2">
                            <span className="sintegra-label">Descrição da Atividade:</span> <span className="sintegra-val">{cnaeDesc ? cnaeDesc.toUpperCase() : '-'}</span>
                          </td>
                        </tr>
                      </tbody>
                    </table>

                    {/* SEÇÃO 4: ATIVIDADES SECUNDÁRIAS */}
                    <table className="sintegra-table pdf-no-break">
                      <thead>
                        <tr>
                          <th className="sintegra-header-cell">ATIVIDADES SECUNDÁRIAS</th>
                        </tr>
                      </thead>
                      <tbody>
                        {cnaesSecundariosList.length > 0 ? (
                          cnaesSecundariosList.map((sec, idx) => (
                            <tr key={idx}>
                              <td className="sintegra-td">
                                <span className="sintegra-val">{sec.subclasse} | {sec.descricao.toUpperCase()}</span>
                              </td>
                            </tr>
                          ))
                        ) : (
                          <tr>
                            <td className="sintegra-td">
                              <span className="sintegra-val">NENHUMA ATIVIDADE SECUNDÁRIA REGISTRADA</span>
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>

                  </div>
                </div>

              </main>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConsultaCNPJ />);
  </script>
</body>
</html>
